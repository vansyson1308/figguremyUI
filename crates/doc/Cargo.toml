[package]
name = "figcraft-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft document model: pages, the node tree, properties, components, styles, variables, prototype data"

[lints]
workspace = true

[dependencies]
figcraft-geom = { workspace = true }
figcraft-color = { workspace = true }
serde = { workspace = true }
# `raw_value`: a stored design context that reads whole is read straight into its types, through
# a `Value` only when it doesn't (design::read_stored).
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
imbl = { workspace = true }
unicode-segmentation = { workspace = true }
